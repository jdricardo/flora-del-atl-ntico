name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Los VITE_* se inyectan en build time: sin esto el hash llega como
      # undefined al bundle y el login del admin queda bloqueado en Pages.
      - run: npm run build
        env:
          VITE_ADMIN_PASSWORD_HASH: ${{ secrets.VITE_ADMIN_PASSWORD_HASH }}
          VITE_ENCRYPTION_KEY: ${{ secrets.VITE_ENCRYPTION_KEY }}
          VITE_SESSION_TIMEOUT: ${{ vars.VITE_SESSION_TIMEOUT || '30' }}
          VITE_MAX_LOGIN_ATTEMPTS: ${{ vars.VITE_MAX_LOGIN_ATTEMPTS || '5' }}
          VITE_LOCKOUT_TIME: ${{ vars.VITE_LOCKOUT_TIME || '15' }}

      # Pages no reescribe rutas hacia index.html: sin esta copia, recargar
      # /tienda o entrar por un enlace directo devuelve el 404 de GitHub.
      - run: cp dist/index.html dist/404.html
      - run: touch dist/.nojekyll

      # enablement habilita Pages por API en el primer run, sin tocar Settings
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
